name: Dependency hygiene

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'  # lunes 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  outdated:
    name: Detectar dependencias desactualizadas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra schema
      - name: pip list --outdated
        run: uv run pip list --outdated --format json | tee /tmp/outdated.json
      - name: Resumen
        run: |
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('/tmp/outdated.json').read_text())
          if not data:
              print("✅ Todas las dependencias al día")
          else:
              print(f"📦 {len(data)} paquete(s) con versión nueva disponible:")
              for pkg in data:
                  print(f"  - {pkg['name']}  {pkg['version']} → {pkg['latest_version']}")
          PY
        continue-on-error: true
